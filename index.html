
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#166534">
<title>GaonBazaar | Customer App</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
:root{--green:#166534;--dark:#14532d;--ink:#17211b;--muted:#68756d;--line:#e6ebe7;--canvas:#f6f8f6}
*{box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--canvas);color:var(--ink)}
button,input,select,textarea{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #86efac;outline-offset:2px}
.btn-primary{background:var(--green);color:white;transition:.18s}
.btn-primary:hover{background:var(--dark)}
.panel{background:white;border:1px solid var(--line);border-radius:18px}
.field{width:100%;border:1px solid #dce4de;border-radius:11px;padding:11px 12px;background:white;font-size:13px}
.field:focus{border-color:#16a34a;outline:3px solid #dcfce7}
.chip{border:1px solid #e1e8e2;background:white;color:#526057}
.chip.active{background:var(--green);border-color:var(--green);color:white}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{scrollbar-width:none}
.overlay{background:rgba(12,22,15,.52);backdrop-filter:blur(3px)}
.toast{animation:toastIn .2s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.product-card{transition:.18s}
.product-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(18,45,27,.08)}
@media(min-width:768px){.content-wrap{max-width:1180px}}
</style>
</head>

<body class="min-h-screen" data-app="customer">

<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-[#e6ebe7]">
<div class="content-wrap mx-auto px-4 lg:px-6">
<div class="h-[70px] flex items-center justify-between gap-4">

<a href="#" onclick="returnToStore();return false" class="flex items-center gap-3">
<div class="w-11 h-11 rounded-2xl bg-green-800 text-white flex items-center justify-center">
<i class="fa-solid fa-basket-shopping text-lg"></i>
</div>
<div>
<div class="text-[19px] font-extrabold">Gaon<span class="text-green-700">Bazaar</span></div>
<div class="text-[10px] text-slate-500 font-semibold tracking-wider uppercase">Customer App</div>
</div>
</a>

<div class="hidden md:flex items-center gap-2 text-xs text-slate-500">
<i class="fa-solid fa-location-dot text-green-700"></i>
<span id="header-address">Add your delivery address</span>
<button onclick="openAddress()" class="text-green-700 font-bold">Change</button>
</div>

<div class="flex items-center gap-2">
<button onclick="openCart()" class="relative w-10 h-10 rounded-xl border">
<i class="fa-solid fa-bag-shopping"></i>
<span id="cart-count" class="absolute -top-1 -right-1 min-w-5 h-5 rounded-full bg-green-700 text-white text-[10px] flex items-center justify-center">0</span>
</button>
<button onclick="openProfile()" class="h-10 px-3 rounded-xl bg-slate-900 text-white text-xs font-bold">
<i class="fa-regular fa-user mr-1"></i><span id="profile-label">Your account</span>
</button>
</div>

</div>
</div>
</header>

<main id="app" class="content-wrap mx-auto px-4 lg:px-6 py-6 pb-28"></main>

<button id="mobile-cart" onclick="openCart()" class="hidden fixed bottom-4 left-4 right-4 z-40 mx-auto max-w-lg md:max-w-md md:left-auto md:right-6 btn-primary rounded-2xl p-3.5 shadow-xl flex items-center justify-between">
<span>
<span id="mobile-cart-count" class="block text-[10px] text-green-100 font-bold">0 items</span>
<span id="mobile-cart-total" class="font-extrabold">₹0</span>
</span>
<span class="font-bold text-sm">Go to Cart <i class="fa-solid fa-arrow-right ml-1"></i></span>
</button>

<!-- CART -->
<div id="cart-overlay" class="overlay fixed inset-0 z-40 hidden" onclick="if(event.target===this)closeCart()">
<aside class="absolute right-0 top-0 h-full w-full max-w-md bg-[#f7f9f7] flex flex-col">
<div class="bg-white px-5 py-4 border-b flex items-center justify-between">
<div>
<h2 class="font-extrabold text-lg">Your cart</h2>
<p class="text-xs text-slate-500">Review your items before checkout</p>
</div>
<button onclick="closeCart()" class="w-9 h-9 rounded-full bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
</div>

<div class="p-4 overflow-y-auto flex-1 space-y-4">
<div id="cart-lines" class="panel p-3 space-y-3"></div>

<div class="panel p-4 space-y-3">
<p class="text-xs font-extrabold uppercase text-slate-500">Order type</p>
<div class="grid grid-cols-2 gap-2">
<button id="delivery-option" onclick="setFulfillment('delivery')" class="rounded-xl border-2 border-green-700 bg-green-50 p-3 text-left">
<i class="fa-solid fa-motorcycle text-green-700"></i>
<span class="block text-xs font-bold mt-1">Home delivery</span>
</button>
<button id="pickup-option" onclick="setFulfillment('pickup')" class="rounded-xl border p-3 text-left">
<i class="fa-solid fa-store"></i>
<span class="block text-xs font-bold mt-1">Store pickup</span>
</button>
</div>

<div id="delivery-address-wrap">
<label class="text-xs font-bold block mb-1">Delivery address</label>
<textarea id="checkout-address" class="field" placeholder="House, street, village / locality"></textarea>
</div>

<div>
<label class="text-xs font-bold block mb-1">Customer name</label>
<input id="checkout-name" class="field" placeholder="Enter your name">
</div>

<div>
<label class="text-xs font-bold block mb-1">Mobile number</label>
<input id="checkout-phone" class="field" maxlength="10" placeholder="10-digit mobile number" disabled>
</div>
</div>

<div class="panel p-4 space-y-2 text-sm">
<div class="flex justify-between"><span>Items total</span><span id="subtotal">₹0</span></div>
<div class="flex justify-between"><span>Delivery fee</span><span id="delivery-fee">₹0</span></div>
<div class="border-t pt-3 flex justify-between font-extrabold text-base">
<span>Grand total</span><span id="grand-total">₹0</span>
</div>

</div>

<button id="place-order-button" onclick="placeOrder()" class="btn-primary w-full rounded-xl py-3.5 font-extrabold flex justify-between px-4">
<span>Place order</span><span id="place-total">₹0 →</span>
</button>
</div>
</aside>
</div>

<!-- AUTH -->
<div id="customer-auth" class="overlay fixed inset-0 z-[70] hidden items-center justify-center p-4">
<section class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-5">
<div class="flex justify-between items-center mb-4">
<div>
<h2 class="text-xl font-extrabold">GaonBazaar Account</h2>
<p class="text-xs text-slate-500 mt-1">Login with your mobile number</p>
</div>
<button onclick="closeCustomerAuth()" class="w-9 h-9 bg-slate-100 rounded-full"><i class="fa-solid fa-xmark"></i></button>
</div>

<div id="phone-step">
<label class="text-xs font-bold">Mobile number</label>

<span class="bg-slate-100 rounded-xl p-3 text-sm font-bold">+91</span>
<input id="customer-phone" class="field" type="tel" maxlength="10" placeholder="10-digit mobile number">
</div>
<button id="send-otp-button" onclick="sendCustomerOTP()" class="btn-primary w-full rounded-xl p-3 font-bold mt-3">Send OTP</button>
</div>

<div id="otp-step" class="hidden">
<label class="text-xs font-bold">Enter OTP</label>
<input id="customer-otp" class="field text-center tracking-[.4em]" inputmode="numeric" maxlength="6" placeholder="6-digit OTP">
<button onclick="verifyCustomerOTP()" class="btn-primary w-full rounded-xl p-3 font-bold mt-3">Verify & Login</button>
<button onclick="backToPhone()" class="w-full text-green-700 text-xs font-bold mt-3">Change mobile number</button>
</div>

<div id="recaptcha-container"></div>
<p id="customer-auth-message" class="text-xs text-center mt-4 text-red-600"></p>
</section>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="overlay fixed inset-0 z-50 hidden items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
<section class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-5">
<div class="flex justify-between items-center mb-4">
<h3 id="modal-title" class="font-extrabold text-lg">Details</h3>
<button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
</div>
<div id="modal-content"></div>
</section>
</div>

<div id="toast" class="hidden toast fixed top-20 left-1/2 -translate-x-1/2 z-[80] bg-slate-900 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-xl max-w-[90vw] text-center"></div>

<script>
'use strict';

const STORAGE_KEY='gaonbazaar_professional_v1';
 window.firebaseCustomer = null;

let state={
 products:[],
 cart:[],
 orders:[],
 profile:{name:'',phone:''},
 address:'',
 category:'All',
 search:'',
 fulfillment:'delivery'
};

function loadLocal(){
 try{
 const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
 if(s&&typeof s==='object'){
 state={...state,...s};
 state.cart=Array.isArray(s.cart)?s.cart:[];
 state.orders=[];
 state.products=[];
 }
 }catch(e){}
}
function save(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}
function money(n){
 return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
}
function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
 const el=document.getElementById('toast');
 el.textContent=msg;
 el.classList.remove('hidden');
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>el.classList.add('hidden'),3000);
}
function setHeader(){
 document.getElementById('header-address').textContent=state.address||'Add your delivery address';
 document.getElementById('profile-label').textContent=state.profile.name||'Your account';
 const count=state.cart.reduce((s,x)=>s+x.qty,0);
 document.getElementById('cart-count').textContent=count;
 document.getElementById('mobile-cart-count').textContent=count+' item'+(count===1?'':'s');
 document.getElementById('mobile-cart-total').textContent=money(cartTotal());
 document.getElementById('mobile-cart').classList.toggle('hidden',count===0);
}
function render(){
 setHeader();
 renderCustomer();
}
function renderCustomer(){
 const categories=['All','Grocery','Vegetables','Dairy'];
 const term=state.search.toLowerCase();
 const products=state.products.filter(p=>p.active&&p.stock>0&&(state.category==='All'||p.category===state.category)&&(`${p.name} ${p.localName||''} ${p.shop}`).toLowerCase().includes(term));

 const activeOrders=state.orders.filter(o=>!['Delivered','Cancelled'].includes(o.status));

 document.getElementById('app').innerHTML=`
 <section class="rounded-3xl bg-gradient-to-r from-green-900 to-green-700 text-white p-6 md:p-8 mb-6 relative overflow-hidden">
 <div class="relative z-10 max-w-2xl">
 <span class="bg-white/15 rounded-full px-3 py-1 text-[10px] font-bold uppercase">Shop local. Shop easy.</span>
 <h1 class="text-2xl md:text-3xl font-extrabold mt-3">Everyday essentials,<br> from stores around you.</h1>
 <p class="text-sm text-green-100 mt-2">Discover groceries, fresh vegetables and dairy products from your neighbourhood shops.</p>
 <button onclick="openAddress()" class="mt-5 bg-white text-green-900 rounded-xl px-4 py-2.5 text-xs font-extrabold">Add delivery address</button>
 </div>
 <div class="absolute -right-8 -bottom-12 text-[170px] opacity-10">🛍️</div>
 </section>

 <section class="panel p-4 mb-6 flex items-center justify-between gap-3">
 <div><h2 class="font-extrabold">My Orders</h2><p class="text-xs text-slate-500 mt-1">Track your purchases and order history.</p></div>
 <button onclick="renderMyOrders()" class="btn-primary rounded-xl px-4 py-3 text-xs font-bold">View Orders →</button>
 </section>

 ${activeOrders.length?`<section class="mb-6"><h2 class="font-extrabold mb-3">Your active orders</h2><div class="grid md:grid-cols-2 gap-3">${activeOrders.map(orderCard).join('')}</div></section>`:''}

 <section class="flex flex-col sm:flex-row justify-between gap-3 mb-4">
 <div><p class="text-xs font-bold text-green-700 uppercase">Local marketplace</p><h2 class="text-xl font-extrabold mt-1">Shop essentials</h2></div>
 <input id="product-search" class="field sm:max-w-xs" placeholder="Search products or stores..." value="${esc(state.search)}" oninput="setSearch(this.value)">
 </section>

 <div class="flex gap-2 overflow-x-auto no-scrollbar pb-3 mb-2">
 ${categories.map(c=>`<button onclick="setCategory('${c}')" class="chip ${state.category===c?'active':''} rounded-full px-4 py-2 text-xs font-bold">${c}</button>`).join('')}
 </div>

 ${products.length?`<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">${products.map(productCard).join('')}</div>`:`<div class="panel p-10 text-center"><div class="text-4xl mb-3">🔎</div><h3 class="font-extrabold">No products found</h3><p class="text-sm text-slate-500 mt-1">${state.products.length?'Try another search or category.':'Products will appear here when shops publish their catalogue.'}</p></div>`}
 `;
}
function productCard(p){
 const item=state.cart.find(x=>x.id===p.id);
 return `<article class="product-card panel p-3 flex flex-col min-w-0">
 <div class="h-28 rounded-xl bg-[#f3f7f3] flex items-center justify-center text-5xl">${esc(p.emoji||'📦')}</div>
 <div class="mt-3 flex-1"><p class="text-[10px] text-slate-500 truncate">${esc(p.shop)}</p><h3 class="font-extrabold text-sm mt-1">${esc(p.name)}</h3><p class="text-[11px] text-slate-500">${esc(p.weight)}</p></div>
 <div class="flex items-center justify-between gap-2 mt-3"><b>${money(p.price)}</b>
 ${item?`<div class="flex items-center gap-2 bg-green-700 text-white rounded-lg px-2 py-1"><button onclick="changeCart('${p.id}',-1)">−</button><b>${item.qty}</b><button onclick="changeCart('${p.id}',1)">+</button></div>`:`<button onclick="changeCart('${p.id}',1)" class="border border-green-700 text-green-800 rounded-lg px-3 py-1.5 text-xs font-extrabold">ADD</button>`}
 </div></article>`;
}
function setCategory(c){state.category=c;save();renderCustomer();}
function setSearch(v){
 state.search=v;
 save();
 const pos=document.getElementById('product-search')?.selectionStart;
 renderCustomer();
 const input=document.getElementById('product-search');
 input?.focus();
 if(pos!==undefined)input?.setSelectionRange(pos,pos);
}
function cartItems(){
 return state.cart.map(c=>{
 const p=state.products.find(x=>x.id===c.id);
 return p?{...p,qty:c.qty}:null;
 }).filter(Boolean);
}
function cartTotal(){
 return cartItems().reduce((s,p)=>s+p.price*p.qty,0);
}
function changeCart(id,delta){
 const p=state.products.find(x=>x.id===id);
 if(!p)return;
 let item=state.cart.find(x=>x.id===id);
 if(!item&&delta>0){
 if(p.stock<1)return toast('Product out of stock.');
 state.cart.push({id,qty:1});
 }else if(item){
 if(delta>0&&item.qty>=p.stock)return toast('Available stock limit reached.');
 item.qty+=delta;
 if(item.qty<=0)state.cart=state.cart.filter(x=>x.id!==id);
 }
 save();
 render();
 if(!document.getElementById('cart-overlay').classList.contains('hidden'))renderCart();
}

function openCart(){
 if(!state.cart.length)return toast('Your cart is empty.');

 if(!window.firebaseCustomer){
   openCustomerAuth();
   return toast('Login before checkout.');
 }

 document.getElementById('checkout-address').value=state.address;
 document.getElementById('checkout-name').value=state.profile.name;
 document.getElementById('checkout-phone').value=state.profile.phone;
 document.getElementById('cart-overlay').classList.remove('hidden');
 renderCart();
}

function closeCart(){
 document.getElementById('cart-overlay').classList.add('hidden');
}
function setFulfillment(mode){
 state.fulfillment=mode;
 save();
 renderCart();
}
function renderCart(){
 const items=cartItems();
 document.getElementById('cart-lines').innerHTML=items.length?items.map(p=>`
 <div class="flex items-center gap-3">
 <div class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-xl">${esc(p.emoji||'📦')}</div>
 <div class="flex-1 min-w-0"><p class="text-xs font-extrabold">${esc(p.name)}</p><p class="text-[11px] text-slate-500">${money(p.price)} × ${p.qty}</p></div>
 <div class="flex items-center gap-2 border rounded-lg px-2 py-1"><button onclick="changeCart('${p.id}',-1)">−</button><b>${p.qty}</b><button onclick="changeCart('${p.id}',1)">+</button></div>
 </div>`).join(''):'<p class="text-center text-sm py-5">Your cart is empty.</p>';

 const subtotal=cartTotal();
 const fee=state.fulfillment==='pickup'||subtotal>=299?0:20;
 const total=subtotal+fee;
 document.getElementById('subtotal').textContent=money(subtotal);
 document.getElementById('delivery-fee').textContent=fee?money(fee):'Free';
 document.getElementById('grand-total').textContent=money(total);
 document.getElementById('place-total').textContent=money(total)+' →';
 document.getElementById('delivery-address-wrap').classList.toggle('hidden',state.fulfillment==='pickup');
 document.getElementById('delivery-option').className=state.fulfillment==='delivery'?'rounded-xl border-2 border-green-700 bg-green-50 p-3 text-left':'rounded-xl border p-3 text-left';
 document.getElementById('pickup-option').className=state.fulfillment==='pickup'?'rounded-xl border-2 border-green-700 bg-green-50 p-3 text-left':'rounded-xl border p-3 text-left';
}
function orderCard(o){
 return `<article class="panel p-4">
 <div class="flex justify-between gap-2"><div><p class="text-xs text-slate-500">Order #${esc(o.id)}</p><p class="font-extrabold text-sm mt-1">${esc(o.status)}</p></div><b class="text-green-700 text-xs">${money(o.total)}</b></div>
 <p class="text-xs text-slate-500 mt-2">${o.mode==='pickup'?'Store pickup':'Home delivery'} · ${o.items.length} product(s)</p>
 <button onclick="openOrderDetails('${esc(o.id)}')" class="mt-3 text-xs font-extrabold text-green-700">View details →</button>
 </article>`;
}
function renderMyOrders(){
 const orders=state.orders;
 document.getElementById('app').innerHTML=`
 <button onclick="render()" class="text-xs font-bold text-green-700 mb-4">← Back to shopping</button>
 <h1 class="text-2xl font-extrabold mb-4">My Orders</h1>
 ${orders.length?`<div class="space-y-3">${orders.map(orderCard).join('')}</div>`:`<div class="panel p-10 text-center"><i class="fa-solid fa-bag-shopping text-4xl text-slate-300"></i><h3 class="font-extrabold mt-3">No orders yet</h3><p class="text-sm text-slate-500 mt-1">Your orders will appear here.</p></div>`}`;
}
function openOrderDetails(id){
 const o=state.orders.find(x=>x.id===id);
 if(!o)return;
 const steps=['Order Placed','Picking in Progress','Packing Complete',...(o.mode==='delivery'?['Picked Up (Out for Delivery)']:[]),'Delivered'];
 const current=steps.indexOf(o.status);
 openModal('Order Details',`
 <div class="bg-slate-50 rounded-xl p-3 mb-4">
 <p class="text-xs text-slate-500">Order ID</p><b>#${esc(o.id)}</b>
 <p class="font-bold mt-2">${esc(o.status)}</p>
 </div>
 <h4 class="font-extrabold text-sm mb-3">Order tracking</h4>
 <div class="space-y-2 mb-5">${steps.map((s,i)=>`<p class="text-xs ${i<=current?'text-green-700 font-bold':'text-slate-400'}"><i class="fa-solid ${i<=current?'fa-circle-check':'fa-circle'} mr-2"></i>${s}</p>`).join('')}</div>
 <h4 class="font-extrabold text-sm mb-3">Items ordered</h4>
 <div class="space-y-2">${o.items.map(i=>`<div class="flex justify-between text-xs"><span>${esc(i.name)} × ${i.qty}</span><b>${money(i.price*i.qty)}</b></div>`).join('')}</div>
 <div class="border-t mt-4 pt-3 flex justify-between font-extrabold"><span>Grand total</span><span>${money(o.total)}</span></div>
 <p class="text-xs text-slate-500 mt-3">${esc(o.address)}</p>
 `);
}
function openModal(title,content){
 document.getElementById('modal-title').textContent=title;
 document.getElementById('modal-content').innerHTML=content;
 document.getElementById('modal-overlay').classList.remove('hidden');
 document.getElementById('modal-overlay').classList.add('flex');
}
function closeModal(){
 document.getElementById('modal-overlay').classList.add('hidden');
 document.getElementById('modal-overlay').classList.remove('flex');
}
function openAddress(){
 if(!window.firebaseCustomer){
   openCustomerAuth();
   return toast('Login first to save your address.');
 }

 openModal('Delivery address',`
 <label class="text-xs font-bold block mb-2">Your address</label>
 <textarea id="address-input" class="field min-h-24">${esc(state.address)}</textarea>
 <button onclick="saveAddress()" class="btn-primary w-full rounded-xl py-3 mt-3 font-bold">Save address</button>`);
}

function saveAddress(){
 const v=document.getElementById('address-input').value.trim();
 if(!v)return toast('Enter your address.');
 state.address=v;
 save();
 closeModal();
 setHeader();
 toast('Address saved.');
}
function openProfile(){
 if(!window.firebaseCustomer){
   openCustomerAuth();
   return;
 }

 openModal('Your account',`
 <p class="text-xs text-green-700 font-bold mb-3">✓ Logged in</p>
 <label class="text-xs font-bold">Full name</label>
 <input id="profile-name" class="field mt-1" value="${esc(state.profile.name)}">
 <label class="text-xs font-bold block mt-3">Mobile number</label>
 <input class="field mt-1" value="${esc(state.profile.phone)}" disabled>
 <button onclick="saveProfile()" class="btn-primary w-full rounded-xl py-3 mt-4 font-bold">Save details</button>
 <button onclick="customerLogout()" class="w-full py-3 text-red-600 font-bold text-sm">Logout</button>`);
}
function returnToStore(){render();}
function init(){loadLocal();render();}
init();
</script>

<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
 getAuth,RecaptchaVerifier,signInWithPhoneNumber,
 onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
 getFirestore,doc,getDoc,setDoc,collection,
 getDocs,query,where,runTransaction,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

/* CUSTOMER APP SEPARATE FIREBASE INSTANCE */
const appName="GaonBazaarCustomer";
const firebaseApp=getApps().some(a=>a.name===appName)
 ?getApp(appName)
 :initializeApp(firebaseConfig,appName);

const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);

let firebaseCustomer=null;
 window.firebaseCustomer = null;
let confirmationResult=null;
let recaptchaVerifier=null;
let orderBusy=false;

/* AUTH UI */
window.openCustomerAuth=()=>{
 document.getElementById('customer-auth').classList.remove('hidden');
 document.getElementById('customer-auth').classList.add('flex');
};
window.closeCustomerAuth=()=>{
 document.getElementById('customer-auth').classList.add('hidden');
 document.getElementById('customer-auth').classList.remove('flex');
};
window.backToPhone=()=>{
 document.getElementById('phone-step').classList.remove('hidden');
 document.getElementById('otp-step').classList.add('hidden');
};
function authMessage(message,error=true){
 const el=document.getElementById('customer-auth-message');
 el.textContent=message;
 el.className='text-xs text-center mt-4 '+(error?'text-red-600':'text-green-700');
}

/* SEND OTP */
window.sendCustomerOTP=async()=>{
 const phone=document.getElementById('customer-phone').value.trim();
 if(!/^[6-9]\d{9}$/.test(phone))return authMessage('Enter a valid 10-digit Indian mobile number.');

 const button=document.getElementById('send-otp-button');
 button.disabled=true;

 try{
 authMessage('Sending OTP...',false);

 if(!recaptchaVerifier){
 recaptchaVerifier=new RecaptchaVerifier(auth,'recaptcha-container',{size:'invisible'});
 }

 await recaptchaVerifier.render();

 confirmationResult=await signInWithPhoneNumber(auth,'+91'+phone,recaptchaVerifier);

 document.getElementById('phone-step').classList.add('hidden');
 document.getElementById('otp-step').classList.remove('hidden');
 authMessage('OTP sent successfully.',false);

 }catch(error){
 console.error('OTP error:',error);
 authMessage(error.message||'Could not send OTP.');
 if(recaptchaVerifier){
 try{await recaptchaVerifier.clear();}catch(e){}
 recaptchaVerifier=null;
 }
 }finally{
 button.disabled=false;
 }
};

/* VERIFY OTP */
window.verifyCustomerOTP=async()=>{
 const otp=document.getElementById('customer-otp').value.trim();
 if(!/^\d{6}$/.test(otp))return authMessage('Enter the 6-digit OTP.');
 if(!confirmationResult)return authMessage('Please request a new OTP.');

 try{
 authMessage('Verifying OTP...',false);
 await confirmationResult.confirm(otp);
 closeCustomerAuth();
 toast('Login successful!');
 }catch(error){
 console.error(error);
 authMessage('OTP verification failed: '+error.message);
 }
};

/* SAVE CUSTOMER PROFILE */
async function saveCustomerProfile(user){
 const ref=doc(db,'users',user.uid);
 const snap=await getDoc(ref);
 const old=snap.exists()?snap.data():{};

 await setDoc(ref,{
 uid:user.uid,
 phone:user.phoneNumber,
 role:old.role||'customer',
 name:old.name||state.profile.name||'',
 createdAt:old.createdAt||serverTimestamp(),
 updatedAt:serverTimestamp()
 },{merge:true});

 state.profile={
 name:old.name||state.profile.name||'',
 phone:user.phoneNumber.replace('+91','')
 };
 save();
 setHeader();
}

/* PROFILE UPDATE */

/* LOAD PRODUCTS */
async function loadLiveProducts(){
 try{
 const q=query(collection(db,'products'),where('active','==',true));
 const snap=await getDocs(q);

 const products=snap.docs.map(d=>{
 const p=d.data();
 return{
 id:d.id,
 name:p.name||'',
 localName:p.localName||'',
 weight:p.weight||p.unit||'',
 price:Number(p.price||0),
 shop:p.shopName||p.shop||'Local Store',
 shopId:p.shopId||'',
 category:p.category||'Grocery',
 stock:Number(p.stock||0),
 emoji:p.emoji||'📦',
 active:p.active===true
 };
 }).filter(p=>p.shopId&&p.stock>0&&p.price>0);

 state.products=products;
 state.cart=state.cart.filter(c=>products.some(p=>p.id===c.id&&p.stock>=c.qty));
 save();
 render();

 }catch(error){
 console.error('Product loading error:',error);
 toast('Could not load products: '+error.message);
 }
}

/* CUSTOMER ORDERS */
async function loadCustomerOrders(){
 if(!firebaseCustomer){state.orders=[];return;}

 try{
 const q=query(collection(db,'orders'),where('customerUid','==',firebaseCustomer.uid));
 const snap=await getDocs(q);

 state.orders=snap.docs.map(d=>{
 const o=d.data();
 return{
 id:d.id,
 customerName:o.customerName||'',
 customerPhone:o.customerPhone||'',
 address:o.address||'',
 items:o.items||[],
 subtotal:Number(o.subtotal||0),
 fee:Number(o.deliveryFee||0),
 total:Number(o.total||0),
 mode:o.mode||'delivery',
 status:o.status||'Order Placed',
 createdAt:o.createdAt?.toDate?o.createdAt.toDate().toISOString():new Date().toISOString()
 };
 }).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

 save();
 }catch(error){
 console.error('Order loading error:',error);
 toast('Could not load orders: '+error.message);
 }
}

/* PLACE ORDER */
window.placeOrder=async()=>{
 if(orderBusy)return;

 if(!firebaseCustomer){
 closeCart();
 openCustomerAuth();
 return toast('Login with your mobile number before placing an order.');
 }

 const items=cartItems();
 const name=document.getElementById('checkout-name').value.trim();
 const address=document.getElementById('checkout-address').value.trim();

 if(!items.length)return toast('Your cart is empty.');
 if(!name)return toast('Please enter your name.');
 if(state.fulfillment==='delivery'&&!address)return toast('Please enter your delivery address.');

 for(const item of items){
 if(!item.shopId)return toast('A product has no Shop ID. Please contact the shop.');
 }

 orderBusy=true;
 const button=document.getElementById('place-order-button');
 button.disabled=true;
 button.textContent='Placing order...';

 try{
 const grouped={};

 for(const item of items){
 if(!grouped[item.shopId])grouped[item.shopId]=[];
 grouped[item.shopId].push(item);
 }

 const shopIds=Object.keys(grouped);
 const orderRefs=shopIds.map(()=>doc(collection(db,'orders')));

 await runTransaction(db,async transaction=>{
 const productRefs=items.map(item=>doc(db,'products',item.id));
 const productSnaps=[];

 /* READ ALL PRODUCTS FIRST */
 for(const ref of productRefs){
 productSnaps.push(await transaction.get(ref));
 }

 /* VALIDATE STOCK AND SHOP */
 productSnaps.forEach((snap,index)=>{
 if(!snap.exists())throw new Error('A product is no longer available.');

 const product=snap.data();
 const item=items[index];

 if(product.active!==true||
 Number(product.stock)<item.qty||
 product.shopId!==item.shopId){
 throw new Error('Stock changed. Please review your cart.');
 }
 });

 /* UPDATE STOCK */
 productSnaps.forEach((snap,index)=>{
 const product=snap.data();
 const item=items[index];

 transaction.update(productRefs[index],{
 stock:Number(product.stock)-item.qty,
 updatedAt:serverTimestamp()
 });
 });

 /* CREATE ONE ORDER PER SHOP */
 shopIds.forEach((shopId,index)=>{
 const shopItems=grouped[shopId];

 const subtotal=shopItems.reduce((sum,item)=>sum+item.price*item.qty,0);
 const fee=state.fulfillment==='pickup'||subtotal>=299?0:20;

 transaction.set(orderRefs[index],{
 checkoutId:crypto.randomUUID(),
 customerUid:firebaseCustomer.uid,
 customerName:name,
 customerPhone:firebaseCustomer.phoneNumber,
 shopId,
 items:shopItems.map(item=>({
 productId:item.id,
 name:item.name,
 weight:item.weight,
 price:item.price,
 qty:item.qty
 })),
 subtotal,
 deliveryFee:fee,
 total:subtotal+fee,
 mode:state.fulfillment,
 address:state.fulfillment==='pickup'?'Store pickup':address,
 status:'Order Placed',
 createdAt:serverTimestamp()
 });
 });
 });

 /* SAVE CUSTOMER DETAILS */
 await setDoc(doc(db,'users',firebaseCustomer.uid),{
 uid:firebaseCustomer.uid,
 name,
 phone:firebaseCustomer.phoneNumber,
 role:'customer',
 updatedAt:serverTimestamp()
 },{merge:true});

 state.cart=[];
 state.profile={name,phone:firebaseCustomer.phoneNumber.replace('+91','')};
 if(state.fulfillment==='delivery')state.address=address;
 save();

 closeCart();
 await loadLiveProducts();
 await loadCustomerOrders();
 render();
 toast('Your order has been placed successfully!');

 }catch(error){
 console.error('PLACE ORDER ERROR:',error);
 toast('Order failed: '+error.message);
 }finally{
 orderBusy=false;
 button.disabled=false;
 button.innerHTML='<span>Place order</span><span id="place-total">₹0 →</span>';
 }
};

/* ADDRESS */
const previousOpenAddress=window.openAddress;
window.openAddress=()=>{
 if(!firebaseCustomer){
 openCustomerAuth();
 return toast('Login first to save your delivery address.');
 }
 previousOpenAddress();
};

onAuthStateChanged(auth, async (user) => {

  firebaseCustomer = user || null;
  window.firebaseCustomer = firebaseCustomer;

  if (user) {
    try {
      await saveCustomerProfile(user);
      await loadCustomerOrders();
      await loadLiveProducts();
      setHeader();
    } catch (error) {
      console.error('Customer account loading error:', error);
      toast('Account loading failed: ' + error.message);
    }
  } else {
    state.orders = [];
    state.cart = [];
    save();
    render();
  }

});

/* INITIAL LOAD */
loadLiveProducts();
